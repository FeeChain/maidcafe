<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>maidcafe ☕ 听力室</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☕</text></svg>">
<link rel="stylesheet" href="/static/style.css">
<link rel="stylesheet" href="/static/listen.css">
</head>
<body>
<header>
  <div class="brand">maidcafe <span class="cup">☕</span></div>
  <div class="controls">
    <a href="/" class="tab">← 主页</a>
    <button id="tabList" class="tab active">对话史</button>
    <button id="tabWordbook" class="tab">生词本</button>
  </div>
  <div class="stats" id="genStatus"></div>
</header>

<main>
  <!-- ============ 列表视图 ============ -->
  <section id="listView">
    <div class="gen-row">
      <button id="dailyBtn" class="mk mknext big">☕ 今日任务</button>
      <span id="dailyLine" class="daily-line"></span>
    </div>
    <details class="custom-gen">
      <summary class="hint-line">想自己挑词？</summary>
      <div class="gen-row">
        <button id="genBtn" class="mk">自选生成（最近 6 个生词）</button>
        <input id="customWords" placeholder="或手动输入生词，逗号分隔" />
        <button id="genCustomBtn" class="mk">生成</button>
        <span class="hint-line">自选生成不影响复习排期</span>
      </div>
    </details>
    <div id="dialogueList" class="dlist"></div>
  </section>

  <!-- ============ 播放视图 ============ -->
  <section id="playerView" class="hidden">
    <button id="backBtn" class="mk small">← 返回列表</button>
    <div class="card player-card">
      <div class="player-info">
        <div id="sceneLine" class="scene-line"></div>
        <div id="targetChips" class="target-chips"></div>
        <div id="ratioBadge" class="ratio-badge"></div>
        <div id="turnProgress" class="hint-line"></div>
      </div>
      <div class="player-controls">
        <button id="playBtn2" class="mk big">▶ 播放</button>
        <button id="prevBtn" class="mk small">◂ 上一轮</button>
        <button id="nextBtn" class="mk small">下一轮 ▸</button>
        <button id="loopBtn" class="mk small">循环：关</button>
        <select id="subMode">
          <option value="pure">纯听（隐藏字幕）</option>
          <option value="progressive" selected>逐轮揭示</option>
          <option value="full">全文显示</option>
        </select>
        <button id="delBtn" class="mk small danger">删除</button>
      </div>
      <div class="hint-line" style="padding:10px 20px 0;">任何词都能点开释义 · 点词会自动暂停</div>
      <div id="turnList" class="turn-list"></div>
    </div>
  </section>

  <!-- ============ 生词本视图 ============ -->
  <section id="wordbookView" class="hidden">
    <div class="gen-row">
      <input id="addWordInput" placeholder="手动加词：输入英文单词" />
      <button id="addWordBtn" class="mk">加入生词本</button>
      <span id="addWordMsg" class="daily-line"></span>
    </div>
    <p class="hint-line">机制：听完一段带着它的<b>新对话</b> = 复习一次 · 生词池 → 1 / 3 / 7 / 15 / 30 天 → 毕业</p>
    <h3 class="wb-section">学习中 / 生词池</h3>
    <div id="wordbookList" class="wb-list"></div>
    <details id="gradFold">
      <summary class="wb-section">已毕业 <span id="gradCount"></span> <small>（会作为背景词汇继续在对话里出现 · 点词可再学一遍）</small></summary>
      <input id="gradSearch" placeholder="搜索毕业词…" style="margin:8px 0;max-width:240px;" />
      <div id="gradList" class="wb-list"></div>
    </details>
  </section>

  <!-- 撤销回执条 -->
  <div id="toast" class="toast hidden"
       style="position:fixed;right:24px;bottom:24px;z-index:60;box-shadow:0 6px 24px rgba(90,60,30,.15);">
    <span id="toastMsg"></span><button id="toastUndo">撤销</button>
  </div>

  <!-- 释义卡弹窗 -->
  <div id="wordCard" class="word-card hidden">
    <div class="wc-word" id="wcWord"></div>
    <div class="wc-phon" id="wcPhon"></div>
    <div class="wc-def" id="wcDef"></div>
    <div class="hint-line" id="wcPauseNote" style="padding:0 22px;"></div>
    <div class="wc-actions">
      <button id="wcPlay" class="mk small">🔊 单词发音</button>
      <button id="wcAdd" class="mk small hidden">＋ 加入生词本</button>
      <button id="wcClose" class="mk small">关闭</button>
    </div>
  </div>
</main>

<script src="/static/log.js"></script>
<script src="/static/art.js"></script>
<script src="/static/listen.js"></script>
</body>
</html>
