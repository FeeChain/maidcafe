name: desktop-preview
on:
  workflow_dispatch:
  push:
    branches: ['codex/desktop-*']
  pull_request:
    paths: ['desktop.py', 'app_paths.py', 'ai_runtime.py', 'windows_speech.py', 'packaging/**', 'requirements-desktop.txt', '.github/workflows/desktop.yml']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-desktop.txt
      - name: First-install and data safety tests
        run: python tests/test_desktop.py
      - name: Build native application and installer
        run: python packaging/build_desktop.py
      - name: Test Mac native window, voices and worker
        if: runner.os == 'macOS'
        run: python packaging/smoke_desktop.py dist/maidcafe.app/Contents/MacOS/maidcafe
      - name: Install and test Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP 'maidcafe-installed'
          $installer = Resolve-Path 'dist/maidcafe-0.2.0-preview-Windows-x64-Setup.exe'
          $process = Start-Process $installer -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$installDir" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer failed: $($process.ExitCode)" }
          python packaging/smoke_desktop.py "$installDir/maidcafe.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: maidcafe-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*Setup.exe
            dist/*.zip
          if-no-files-found: error
          retention-days: 30
