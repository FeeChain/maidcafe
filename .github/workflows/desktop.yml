name: installers
on:
  workflow_call:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-15, target: macOS-arm64}
          - {os: macos-15-intel, target: macOS-x86_64}
          - {os: windows-2022, target: Windows-x64}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-desktop.txt
      - name: First-install and platform tests
        run: |
          python tests/test_desktop.py
          python tests/test_assistant_setup.py
          python tests/test_release.py
      - name: Build native installer
        run: python packaging/build_desktop.py 2>&1 | tee build.log
      - name: Install, launch, synthesize speech and prepare AI
        run: python packaging/test_installer.py '${{ matrix.target }}' 2>&1 | tee installer-test.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.target }}
          path: |
            dist/*.dmg
            dist/*Setup.exe
            dist/build-report-*.json
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: installer-logs-${{ matrix.target }}
          path: |
            build.log
            installer-test.log
          retention-days: 14
